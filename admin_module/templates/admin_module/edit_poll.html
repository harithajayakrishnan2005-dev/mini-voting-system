{% extends 'admin_module/base_admin.html' %}
{% block content %}
<div style="max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: #f9f9f9;">
    <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Edit Poll</h2>
    <form method="post">
        {% csrf_token %}
      
        <label for="question" style="font-weight: bold; display: block; margin-bottom: 5px;">Poll Question:</label>
        <input type="text" id="question" name="question" value="{{ poll.question }}" required 
               style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc;">

      
        {% for option in options %}
            <label for="option{{ forloop.counter }}" style="font-weight: bold; display: block; margin-bottom: 5px;">Option {{ forloop.counter }}:</label>
            <input type="text" id="option{{ forloop.counter }}" name="option{{ forloop.counter }}" value="{{ option.text }}" required
                   style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
        {% endfor %}
      {% for i in optional_range %}
            <label for="option{{ i }}" style="font-weight: bold; display: block; margin-bottom: 5px;">Option {{ i }} (optional):</label>
            <input type="text" id="option{{ i }}" name="option{{ i }}" placeholder="Option {{ i }} (optional)"
                   style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
        {% endfor %}

        <button type="submit" 
                style="width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
            Update Poll
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'admin_module:poll_list' %}" style="text-decoration: none; color: #555;">&#8592; Back to Poll List</a>
    </div>
</div>
{% endblock %}
