{% extends "admin_module/base_admin.html" %}
{% block content %}
<h2>Delete Poll</h2>
<p>Are you sure you want to delete poll: "<strong>{{ poll.question }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="background:red; color:white;">Yes, Delete</button>
    <a href="{% url 'admin_module:poll_list' %}">Cancel</a>
</form>
{% endblock %}
