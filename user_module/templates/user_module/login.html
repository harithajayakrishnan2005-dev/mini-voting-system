{% extends "user_module/base.html" %}
{% block content %}
<style>
.page-center {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 120px);
}
.form-box {
    width: 360px;
    padding: 25px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background-color: #fff;
}
.form-box h2 { text-align: center; margin-bottom: 20px; }
.form-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; }
.form-box button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
.form-box button:hover { background-color: #0056b3; }
.form-box p { text-align: center; margin-top: 15px; }
.message { text-align: center; margin-bottom: 15px; color: green; }
.error { text-align: center; margin-bottom: 15px; color: red; }
</style>

<div class="page-center">
    <div class="form-box">
        <h2>Login</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="name" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p>
            <a href="{% url 'user:register' %}">Don't have an account? Register</a>
        </p>
    </div>
</div>
{% endblock %}
