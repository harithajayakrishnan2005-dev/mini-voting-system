{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Voting System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f6f8; color:#333; }

       
        header { background:#0056b3; color:white; padding:15px 40px; display:flex; justify-content:space-between; align-items:center; }
        header h1 { font-size:24px; font-weight:bold; }
        nav a { color:white; margin-left:20px; text-decoration:none; font-weight:500; }
        nav a:hover { text-decoration:underline; }

     
        .welcome { font-weight:bold; margin-right:20px; }

     
        main { padding:30px 40px; }

      
        .btn { display:inline-block; padding:10px 20px; border-radius:5px; font-weight:600; cursor:pointer; border:none; text-decoration:none; transition:0.3s; }
        .btn-primary { background:#007BFF; color:white; }
        .btn-primary:hover { background:#0056b3; }
        .btn-success { background:#28a745; color:white; }
        .btn-success:hover { background:#1e7e34; }
        .btn-danger { background:#dc3545; color:white; }
        .btn-danger:hover { background:#a71d2a; }

      
        .card { background:white; border-radius:10px; padding:20px; box-shadow:0px 4px 15px rgba(0,0,0,0.1); margin-bottom:20px; transition:0.3s; }
        .card:hover { box-shadow:0px 6px 20px rgba(0,0,0,0.15); }

        .card h3 { margin-bottom:15px; color:#0056b3; }

    
        .profile-image { width:150px; height:150px; object-fit:cover; border-radius:50%; border:2px solid #007BFF; margin-bottom:15px; }

        form input, form textarea, form select { width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc; font-size:14px; }
        form button { width:100%; }

      
        @media(max-width:768px){
            header { flex-direction:column; align-items:flex-start; }
            nav a { margin:5px 0; }
            main { padding:20px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Voting System</h1>
    <nav>
        {% if user.is_authenticated %}
            <span class="welcome">Welcome, {{ user.username }}!</span>
            <a href="{% url 'user:dashboard' %}">Dashboard</a>
            <a href="{% url 'user:profile' %}">Profile</a>
            <a href="{% url 'user:logout' %}" >Logout</a>
        {% else %}
            <a href="{% url 'user:login' %}" class="btn btn-primary">Login</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
