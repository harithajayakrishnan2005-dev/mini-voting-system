{% extends "user_module/base.html" %}
{% block content %}

<h2 style="text-align:center; margin-bottom:20px;">Poll Results</h2>

<div style="
    max-width:600px;
    margin:auto;
    background:#f9f9f9;
    padding:20px;
    border-radius:8px;
    border:1px solid #ddd;
">

    <h4 style="text-align:center; margin-bottom:15px;">
        {{ poll.question }}
    </h4>

    <ul style="list-style:none; padding:0;">
        {% for option in poll.options.all %}
            <li style="
                background:#ffffff;
                margin-bottom:10px;
                padding:12px;
                border-radius:6px;
                border:1px solid #e0e0e0;
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">
                <span>{{ option.text }}</span>
                <span style="
                    background:#007bff;
                    color:white;
                    padding:4px 10px;
                    border-radius:12px;
                    font-size:13px;
                ">
                    {{ option.vote_set.count }} vote{{ option.vote_set.count|pluralize }}
                </span>
            </li>
        {% endfor %}
    </ul>

    <div style="text-align:center; margin-top:20px;">
        <a href="{% url 'user:poll_list' %}"
           style="
           text-decoration:none;
           background:#28a745;
           color:white;
           padding:8px 18px;
           border-radius:5px;
           margin-right:10px;
           ">
           Back to Polls
        </a>

        <a href="{% url 'user:my_vote' %}"
           style="
           text-decoration:none;
           background:#6c757d;
           color:white;
           padding:8px 18px;
           border-radius:5px;
           ">
           My Votes
        </a>
    </div>

</div>

{% endblock %}
