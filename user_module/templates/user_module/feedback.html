{% extends "user_module/base.html" %}
{% block content %}
<div style="max-width: 700px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; font-family: Arial, sans-serif;">

    <h2 style="text-align: center; color: #333;">Submit Feedback</h2>

    {% if messages %}
        {% for message in messages %}
            <div style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

       
        <div style="margin-bottom: 15px;">
            <label for="poll_id" style="display: block; font-weight: bold; margin-bottom: 5px;">Poll (optional):</label>
            <select name="poll_id" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="">General Feedback</option>
                {% for poll in polls %}
                    <option value="{{ poll.id }}">{{ poll.question }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Rating:</label>
            <div class="star-rating">
                {% for i in "54321" %}
                    <input type="radio" id="star{{i}}" name="rating" value="{{i}}">
                    <label for="star{{i}}" title="{{i}} stars">&#9733;</label>
                {% endfor %}
            </div>
        </div>

        
        <div style="margin-bottom: 20px;">
            <label for="comment" style="display: block; font-weight: bold; margin-bottom: 5px;">Comment:</label>
            <textarea name="comment" rows="4" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></textarea>
        </div>

        
        <div style="text-align: center;">
            <button type="submit" style="background-color: #28a745; color: white; padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                Submit Feedback
            </button>
        </div>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        <a href="{% url 'user:poll_list' %}" style="text-decoration: none; color: #007bff;">Back to Polls</a>
    </p>
</div>


<style>
.star-rating {
    direction: rtl;
    display: inline-block;
    font-size: 25px;
}
.star-rating input[type="radio"] {
    display: none;
}
.star-rating label {
    color: #ccc;
    cursor: pointer;
}
.star-rating label:hover,
.star-rating label:hover ~ label,
.star-rating input[type="radio"]:checked ~ label {
    color: gold;
}
</style>
{% endblock %}
