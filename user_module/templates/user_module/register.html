{% extends "user_module/base.html" %}

{% block content %}
<div class="form-container">
    <h2>Register</h2>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Confirm Password</label>
        <input type="password" name="password2" required>

        <button type="submit" class="green-btn">Register</button>
    </form>

    <p>Already have an account? <a href="{% url 'user:login' %}">Login</a></p>
</div>

<style>
.form-container {
    max-width: 350px;
    margin: 40px auto;
    padding: 15px;
}

input, button {
    display: block;
    width: 100%;
    margin: 5px 0 15px;
    padding: 8px;
}

button.green-btn {
    background-color: #4CAF50; 
    color: white;
    border: none;
}

button.green-btn:hover {
    background-color: #45a049; 
}
button {
    cursor: pointer;
}

.messages li {
    color: red;
    margin-bottom: 10px;
    list-style: none;
}
</style>

{% endblock %}
